// Top-level build file where you can add configuration options common to all sub-projects/modules.


buildscript {
    repositories {
        gradlePluginPortal()
        mavenLocal()
        maven {
            url 'https://sdk.wdyxgames.com/nexus/repository/sdk-public/'
        }
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.0.2'
        classpath 'robust.gradle.plugin:robust:1.0.6'
        classpath 'robust.gradle.plugin:auto-patch-plugin:1.0.4'
    }
}

allprojects {
    repositories {
        gradlePluginPortal()
        mavenLocal()
        maven {
            url 'https://sdk.wdyxgames.com/nexus/repository/sdk-public/'
        }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
